name: Daily Lexicon update

on:
  schedule:
    # 10:05 UTC = 6:05 AM in Detroit during EDT.
    - cron: "5 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply today's Lexicon content
        run: python scripts/apply_daily.py

      - name: Commit only when content changed
        run: |
          if git diff --quiet; then
            echo "No content change."
            exit 0
          fi
          git config user.name "lexicon-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Daily Lexicon update"
          git push
